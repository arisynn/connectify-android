import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def appVersionFile = rootProject.file('../app-version.json')
def appVersionData = [version: '1.0.0', versionCode: 1]
if (appVersionFile.exists()) {
    appVersionData = new JsonSlurper().parse(appVersionFile)
}
def resolvedVersionName = (appVersionData.version ?: '1.0.0').toString()
def resolvedVersionCode = ((appVersionData.versionCode ?: 1) as int)

def releaseStoreFilePath = System.getenv('CONNECTIFY_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('CONNECTIFY_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('CONNECTIFY_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('CONNECTIFY_RELEASE_KEY_PASSWORD') ?: releaseStorePassword
def hasGradleReleaseSigning = (
    releaseStoreFilePath &&
    file(releaseStoreFilePath).exists() &&
    releaseStorePassword &&
    releaseKeyAlias
)

android {
    namespace = "com.connectify.android"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.connectify.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            // Keep modern Vite chunk paths and static assets intact inside assets/public/
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    signingConfigs {
        if (hasGradleReleaseSigning) {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasGradleReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
